name: Development CI/CD Pipeline

on:
  push:
    branches: [ develop ]
  pull_request:
    types: 
      - closed
    branches: [ develop ]

permissions:
  contents: write
  checks: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Run tests
      run: ./gradlew test
      
    - name: Publish Test Results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always()
      with:
        files: "**/build/test-results/test/*.xml"

  build:
    needs: test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Build with Gradle
      run: ./gradlew build -x test
      
    - name: Build Docker image
      run: docker build -t ktor-users:${{ github.sha }}-dev .

  release-dev:
    name: Release Dev Version
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.ref == 'refs/heads/develop' || (github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'develop')

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Tag Dev Commit
        id: tag-commit
        uses: issue-ops/semver@v2.4.0
        with:
          manifest-path: package.json
          workspace: ${{ github.workspace }}
          ref: develop
          prerelease: dev

      - name: Print version
        run: echo ${{ steps.tag-commit.outputs.version }}
        
      - name: Trigger Jenkins Dev Build
        run: |
          curl -X POST \
            --user ${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_TOKEN }} \
            "${{ secrets.JENKINS_URL }}/job/ktor-users/buildWithParameters?GIT_TAG=${{ steps.tag-commit.outputs.version }}&ENVIRONMENT=dev"
