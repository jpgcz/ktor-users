name: Production CI/CD Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    types: 
      - closed
    branches: [ master ]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Run tests
      run: ./gradlew test
      
    - name: Publish Test Results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always()
      with:
        files: "**/build/test-results/test/*.xml"

  build:
    needs: test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Build with Gradle
      run: ./gradlew build -x test
      
    - name: Build Docker image
      run: docker build -t ktor-users:${{ github.sha }}-prod .

  release-prod:
    name: Release Production Version
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.ref == 'refs/heads/master' || (github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'master')

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Tag Production Commit
        id: tag-commit
        uses: issue-ops/semver@v2.4.0
        with:
          manifest-path: package.json
          workspace: ${{ github.workspace }}
          ref: master

      - name: Print version
        run: echo ${{ steps.tag-commit.outputs.version }}
        
      - name: Trigger Jenkins Production Build
        run: |
          curl -X POST \
            --user ${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_TOKEN }} \
            "${{ secrets.JENKINS_URL }}/job/ktor-users/buildWithParameters?GIT_TAG=${{ steps.tag-commit.outputs.version }}&ENVIRONMENT=prod&DEPLOY_TO_PROD=true"
